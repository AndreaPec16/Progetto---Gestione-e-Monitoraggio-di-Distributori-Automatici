<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Addetto</title>
    <link rel="stylesheet" th:href="@{/Addetto_Manutenzione/home_ad.css}" href="/Addetto_Manutenzione/home_ad.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
</head>
<body>
<header>
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
            <h1>☕ MyCoffee - Dashboard Addetto</h1>
            <p>Benvenuto, <strong id="userName" th:text="${username != null ? username : 'Staff'}">Staff</strong></p>
        </div>
        <div>
            <a href="/logout" style="color: white; font-weight: bold; text-decoration: underline; background: #d32f2f; padding: 10px 15px; border-radius: 5px;">Esci</a>
        </div>
    </div>

    <div class="search-box" style="margin-top: 15px;">
        <input type="text" id="searchInput" placeholder="Inserisci ID macchina...">
        <button id="searchBtn">Cerca</button>
    </div>
</header>

<main>
    <section class="section-box">
        <h2>Macchinette Assegnate</h2>
        <table id="machineTable">
            <thead>
            <tr>
                <th>Codice</th>
                <th>Posizione</th>
                <th>Stato</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </section>

    <section class="section-box">
        <h2>Informazioni Macchina</h2>
        <div id="machineInfo" class="machine-info">
            <p>Seleziona una macchina per visualizzare le informazioni sui prodotti.</p>
        </div>

        <div id="mapDetail" style="height: 350px; width: 100%; margin-top: 20px; border: 1px solid #ccc; display: none;"></div>
    </section>
</main>

<footer>
    <p> Sistema Addetti MyCoffee - 2025</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<script th:src="@{/Addetto_Manutenzione/home_ad.js}" src="/Addetto_Manutenzione/home_ad.js"></script>
</body>
</html>
