<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione Utente</title>
    <link rel="stylesheet" th:href="@{/Cliente/registrazione.css}" href="/Cliente/registrazione.css">
</head>
<body>
<header>
    <h1> ☕ MyCoffee </h1>
    <p>Crea un nuovo account</p>
</header>

<main>
    <section class="register-card">
        <h2>Registrazione</h2>
        <form id="registerForm">

            <input type="text" id="nome" placeholder="Nome Completo" required>

            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="password" id="confirmPassword" placeholder="Conferma password">

            <button type="submit" id="registerBtn">Registrati</button>
        </form>
        <p style="text-align:center; margin-top:10px;">
            Hai già un account? <a th:href="@{/login}">Accedi qui</a>
        </p>
    </section>
</main>

<footer>
    <p> MyCoffee - 2025</p>
</footer>

<script th:src="@{/Cliente/registrazione.js}" src="/Cliente/registrazione.js"></script>
</body>
</html>
