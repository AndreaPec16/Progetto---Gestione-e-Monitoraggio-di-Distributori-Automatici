<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Utente</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>
<header>
    <h1> ☕ MyCoffee </h1>
    <p>Accedi al tuo account</p>
</header>

<main>
    <section class="login-card">
        <h2>Login</h2>

        <div th:if="${param.error}" style="color: red; text-align: center; margin-bottom: 10px;">
            Credenziali non valide!
        </div>
        <div th:if="${param.logout}" style="color: green; text-align: center; margin-bottom: 10px;">
            Logout effettuato con successo.
        </div>

        <form th:action="@{/login}" method="POST">

            <input type="text" id="username" name="username" placeholder="Nome utente" required>

            <input type="password" id="password" name="password" placeholder="Password" required>

            <button type="submit" id="loginBtn">Accedi</button>
        </form>

        <p style="text-align:center; margin-top:10px;">
            Non hai un account? <a th:href="@{/registrazione}">Registrati qui</a>
        </p>

    </section>
</main>

<footer>
    <p> MyCoffee - 2025</p>
</footer>

</body>
</html>
